name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            pair-terminal/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('pair-terminal/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: pair-terminal
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: pair-terminal
        run: cargo clippy --all --all-targets -- -D warnings

      - name: Build
        working-directory: pair-terminal
        run: cargo build --all

      - name: Run tests
        working-directory: pair-terminal
        run: cargo test --all

  rustsec:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}